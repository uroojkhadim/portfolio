<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="ph-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="ph-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <filter id="ph-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#ph-bg)"/>
  <circle cx="680" cy="100" r="140" fill="#f43f5e" opacity="0.15" filter="url(#ph-glow)"/>
  <circle cx="120" cy="400" r="160" fill="#6366f1" opacity="0.12" filter="url(#ph-glow)"/>

  <!-- Phone Screen Frame -->
  <g transform="translate(230, 25)">
    <!-- Device shadow & border -->
    <rect x="0" y="0" width="340" height="450" rx="36" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <!-- Screen area -->
    <rect x="8" y="8" width="324" height="434" rx="28" fill="#0f172a"/>

    <!-- Dynamic Island / Notch -->
    <rect x="110" y="14" width="104" height="20" rx="10" fill="#1e293b"/>
    <circle cx="195" cy="24" r="4" fill="#38bdf8"/>

    <!-- App Header -->
    <text x="24" y="60" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">PREDICTIVE HEALTHCARE</text>
    <text x="24" y="82" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Health Diagnostics</text>

    <!-- Status pill -->
    <rect x="236" y="64" width="64" height="22" rx="11" fill="rgba(244,63,94,0.15)" stroke="#f43f5e" stroke-width="1"/>
    <text x="248" y="79" fill="#fb7185" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">LIVE ML</text>

    <!-- Vital Stats Hero Card -->
    <rect x="20" y="98" width="284" height="130" rx="18" fill="url(#ph-card)" stroke="rgba(255,255,255,0.1)"/>
    <text x="36" y="122" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Heart Rate Variability</text>
    <text x="36" y="152" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">74 <tspan font-size="14" fill="#94a3b8" font-weight="500">BPM</tspan></text>

    <!-- ECG wave pulse -->
    <path d="M 36 195 L 80 195 L 95 180 L 110 210 L 125 160 L 140 220 L 155 195 L 284 195" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Recommendation Cards -->
    <rect x="20" y="240" width="136" height="85" rx="14" fill="url(#ph-card)" stroke="rgba(255,255,255,0.08)"/>
    <text x="32" y="262" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">RISK INDEX</text>
    <text x="32" y="292" fill="#10b981" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">Low (94%)</text>
    <text x="32" y="310" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Optimal Vitals</text>

    <rect x="168" y="240" width="136" height="85" rx="14" fill="url(#ph-card)" stroke="rgba(255,255,255,0.08)"/>
    <text x="180" y="262" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">SLEEP SCORE</text>
    <text x="180" y="292" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">8.2 <tspan font-size="12" fill="#94a3b8">hrs</tspan></text>
    <text x="180" y="310" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">+12% vs last wk</text>

    <!-- AI Recommendation Banner -->
    <rect x="20" y="335" width="284" height="80" rx="14" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)"/>
    <circle cx="44" cy="360" r="14" fill="#6366f1"/>
    <path d="M 40 360 L 43 363 L 49 357" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="358" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">AI Daily Recommendation</text>
    <text x="66" y="375" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="10">Hydration target achieved. Optimal aerobic</text>
    <text x="66" y="390" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="10">training window recommended at 5:00 PM.</text>
  </g>
</svg>