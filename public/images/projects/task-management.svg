<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="tm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="60%" stop-color="#171e38"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="tm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#tm-bg)"/>
  <circle cx="650" cy="120" r="150" fill="#6366f1" opacity="0.18" filter="url(#tm-glow)"/>
  <circle cx="150" cy="380" r="140" fill="#8b5cf6" opacity="0.15" filter="url(#tm-glow)"/>

  <g transform="translate(230, 25)">
    <rect x="0" y="0" width="340" height="450" rx="36" fill="#0a0f1d" stroke="#334155" stroke-width="3"/>
    <rect x="8" y="8" width="324" height="434" rx="28" fill="#0f172a"/>
    <rect x="110" y="14" width="104" height="20" rx="10" fill="#1e293b"/>

    <text x="24" y="60" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">TASK MANAGEMENT</text>
    <text x="24" y="84" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">Today's Priorities</text>

    <!-- Progress summary -->
    <rect x="20" y="100" width="284" height="65" rx="16" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.25)"/>
    <text x="36" y="125" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Project Completion</text>
    <text x="36" y="145" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">8 of 10 tasks completed</text>
    <text x="250" y="138" fill="#6366f1" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">80%</text>

    <!-- Task List Items -->
    <!-- Item 1: Done -->
    <rect x="20" y="175" width="284" height="52" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="42" cy="201" r="10" fill="#10b981"/>
    <path d="M 38 201 L 41 204 L 46 198" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="62" y="198" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-decoration="line-through">Finalize Flutter UI Architecture</text>
    <text x="62" y="213" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">High Priority · Mobile</text>

    <!-- Item 2: Done -->
    <rect x="20" y="235" width="284" height="52" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="42" cy="261" r="10" fill="#10b981"/>
    <path d="M 38 261 L 41 264 L 46 258" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="62" y="258" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-decoration="line-through">Setup SQLite Local Cache</text>
    <text x="62" y="273" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Database · Completed</text>

    <!-- Item 3: In Progress -->
    <rect x="20" y="295" width="284" height="54" rx="12" fill="rgba(99,102,241,0.15)" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="42" cy="322" r="10" fill="none" stroke="#6366f1" stroke-width="2"/>
    <circle cx="42" cy="322" r="4" fill="#6366f1"/>
    <text x="62" y="318" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Integrate Push Notifications</text>
    <text x="62" y="334" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="10">In Progress · Due 4:00 PM</text>

    <!-- Item 4: Upcoming -->
    <rect x="20" y="357" width="284" height="50" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="42" cy="382" r="10" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="62" y="378" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Release Build Profiling</text>
    <text x="62" y="393" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Upcoming · Testing</text>
  </g>
</svg>