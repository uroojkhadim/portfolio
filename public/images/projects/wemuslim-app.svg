<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f17"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="wm-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#wm-bg)"/>
  <circle cx="660" cy="120" r="140" fill="#10b981" opacity="0.18"/>
  <circle cx="140" cy="380" r="150" fill="#f59e0b" opacity="0.12"/>

  <g transform="translate(230, 25)">
    <rect x="0" y="0" width="340" height="450" rx="36" fill="#031d16" stroke="#047857" stroke-width="3"/>
    <rect x="8" y="8" width="324" height="434" rx="28" fill="#04271e"/>
    <rect x="110" y="14" width="104" height="20" rx="10" fill="#064e3b"/>

    <!-- App Title & Crescent -->
    <text x="24" y="60" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">WEMUSLIM UTILITY</text>
    <text x="24" y="84" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">Islamic Companion</text>

    <!-- Next Prayer Card -->
    <rect x="20" y="100" width="284" height="90" rx="16" fill="rgba(16,185,129,0.15)" stroke="rgba(52,211,153,0.3)"/>
    <text x="36" y="126" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11">NEXT PRAYER · ASR</text>
    <text x="36" y="156" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">04:45 <tspan font-size="14" fill="#6ee7b7">PM</tspan></text>
    <text x="36" y="176" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="11">in 1 hour 20 minutes</text>

    <!-- Digital Tasbeeh Counter Circle -->
    <rect x="20" y="202" width="284" height="150" rx="18" fill="url(#wm-card)" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="162" cy="272" r="54" fill="none" stroke="rgba(52,211,153,0.2)" stroke-width="6"/>
    <circle cx="162" cy="272" r="54" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="240 100" stroke-linecap="round"/>
    <text x="162" y="268" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">33</text>
    <text x="162" y="286" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">SUBHANALLAH</text>

    <!-- Quick Utilities -->
    <rect x="20" y="364" width="88" height="48" rx="12" fill="rgba(255,255,255,0.04)"/>
    <text x="64" y="388" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Qibla</text>
    <rect x="118" y="364" width="88" height="48" rx="12" fill="rgba(255,255,255,0.04)"/>
    <text x="162" y="388" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Duas</text>
    <rect x="216" y="364" width="88" height="48" rx="12" fill="rgba(255,255,255,0.04)"/>
    <text x="260" y="388" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Calendar</text>
  </g>
</svg>