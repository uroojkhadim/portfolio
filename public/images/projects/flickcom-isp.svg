<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#0f294a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#fc-bg)"/>
  <circle cx="680" cy="120" r="160" fill="#38bdf8" opacity="0.18"/>

  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="16" fill="#0b132b" stroke="#1e293b" stroke-width="2"/>
    <rect width="680" height="40" rx="16" fill="#1c2541"/>
    <circle cx="24" cy="20" r="5" fill="#ef4444"/>
    <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="20" r="5" fill="#10b981"/>
    <rect x="180" y="8" width="320" height="24" rx="6" fill="#0b132b"/>
    <text x="210" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">flickcom-isp.vercel.app</text>

    <!-- ISP Header -->
    <rect x="0" y="40" width="680" height="48" fill="#111827"/>
    <text x="30" y="70" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="15" font-weight="800">FlickCom <tspan fill="#ffffff">Broadband</tspan></text>
    <text x="220" y="70" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12">Fiber Plans</text>
    <text x="310" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Coverage Map</text>
    <text x="420" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Enterprise</text>
    <rect x="560" y="52" width="90" height="26" rx="6" fill="#0284c7"/>
    <text x="605" y="69" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Get Connected</text>

    <!-- Hero Showcase -->
    <rect x="30" y="104" width="620" height="120" rx="14" fill="rgba(2,132,199,0.15)" stroke="rgba(56,189,248,0.3)"/>
    <text x="50" y="142" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">Ultra-Fast Fiber Internet</text>
    <text x="50" y="166" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Experience 1 Gbps symmetric speed with 99.9% uptime guarantee.</text>

    <!-- Speed Gauge Display -->
    <circle cx="560" cy="164" r="38" fill="none" stroke="rgba(56,189,248,0.2)" stroke-width="6"/>
    <circle cx="560" cy="164" r="38" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="180 60" stroke-linecap="round"/>
    <text x="560" y="162" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="800">1000</text>
    <text x="560" y="176" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">MBPS</text>

    <!-- 3 Plan Cards -->
    <rect x="30" y="240" width="190" height="150" rx="12" fill="#1e293b"/>
    <text x="45" y="268" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Starter Home</text>
    <text x="45" y="296" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">$29 <tspan font-size="12" fill="#94a3b8">/mo</tspan></text>
    <text x="45" y="320" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ 100 Mbps Unlimited</text>
    <text x="45" y="338" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ Free Wi-Fi 6 Router</text>
    <rect x="45" y="352" width="160" height="26" rx="6" fill="#0284c7"/>
    <text x="125" y="369" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Select Plan</text>

    <rect x="245" y="235" width="190" height="160" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="290" y="225" width="100" height="18" rx="9" fill="#0284c7"/>
    <text x="340" y="238" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">MOST POPULAR</text>
    <text x="260" y="268" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Ultra Gamer</text>
    <text x="260" y="296" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">$49 <tspan font-size="12" fill="#94a3b8">/mo</tspan></text>
    <text x="260" y="320" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ 500 Mbps Ultra Low Latency</text>
    <text x="260" y="338" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ Dedicated Static IP</text>
    <rect x="260" y="356" width="160" height="26" rx="6" fill="#38bdf8"/>
    <text x="340" y="373" text-anchor="middle" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Select Plan</text>

    <rect x="460" y="240" width="190" height="150" rx="12" fill="#1e293b"/>
    <text x="475" y="268" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Giga Pro</text>
    <text x="475" y="296" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">$79 <tspan font-size="12" fill="#94a3b8">/mo</tspan></text>
    <text x="475" y="320" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ 1000 Mbps Symmetrical</text>
    <text x="475" y="338" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">✓ 24/7 Priority Support</text>
    <rect x="475" y="352" width="160" height="26" rx="6" fill="#0284c7"/>
    <text x="555" y="369" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Select Plan</text>
  </g>
</svg>