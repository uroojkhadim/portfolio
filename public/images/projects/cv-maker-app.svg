<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cvm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="60%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cvm-phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cvm-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#cvm-bg)"/>
  <circle cx="680" cy="110" r="150" fill="#3b82f6" opacity="0.18"/>
  <circle cx="120" cy="390" r="150" fill="#6366f1" opacity="0.15"/>

  <!-- Phone Mockup Center -->
  <g transform="translate(230, 25)">
    <rect x="0" y="0" width="340" height="450" rx="36" fill="#090d16" stroke="#334155" stroke-width="3"/>
    <rect x="8" y="8" width="324" height="434" rx="28" fill="url(#cvm-phone)"/>
    <rect x="110" y="14" width="104" height="20" rx="10" fill="#1e293b"/>

    <!-- App Header -->
    <text x="24" y="60" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">FLUTTER CV BUILDER</text>
    <text x="24" y="84" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">Resume Creator</text>

    <!-- Step Progress Indicator -->
    <rect x="20" y="100" width="284" height="42" rx="10" fill="#1e293b"/>
    <circle cx="45" cy="121" r="11" fill="#3b82f6"/>
    <text x="45" y="125" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">1</text>
    <line x1="60" y1="121" x2="110" y2="121" stroke="#3b82f6" stroke-width="2"/>

    <circle cx="125" cy="121" r="11" fill="#3b82f6"/>
    <text x="125" y="125" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">2</text>
    <line x1="140" y1="121" x2="190" y2="121" stroke="#475569" stroke-width="2"/>

    <circle cx="205" cy="121" r="11" fill="#334155"/>
    <text x="205" y="125" text-anchor="middle" fill="#94a3b8" font-size="10">3</text>
    <line x1="220" y1="121" x2="270" y2="121" stroke="#475569" stroke-width="2"/>

    <circle cx="280" cy="121" r="11" fill="#334155"/>
    <text x="280" y="125" text-anchor="middle" fill="#94a3b8" font-size="10">4</text>

    <!-- Resume Document Preview Card -->
    <rect x="24" y="155" width="276" height="215" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Resume Mini Header -->
    <rect x="24" y="155" width="276" height="48" rx="12" fill="#1e3a8a"/>
    <circle cx="55" cy="179" r="14" fill="#93c5fd"/>
    <text x="80" y="174" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Alex Morgan</text>
    <text x="80" y="188" fill="#bfdbfe" font-family="-apple-system, sans-serif" font-size="9">Senior Software Engineer</text>

    <!-- Resume Mini Sections -->
    <text x="38" y="222" fill="#1e3a8a" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">SUMMARY</text>
    <line x1="38" y1="226" x2="280" y2="226" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="38" y="232" width="230" height="4" rx="2" fill="#94a3b8"/>
    <rect x="38" y="240" width="180" height="4" rx="2" fill="#cbd5e1"/>

    <text x="38" y="262" fill="#1e3a8a" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">EXPERIENCE</text>
    <line x1="38" y1="266" x2="280" y2="266" stroke="#e2e8f0" stroke-width="1"/>
    <text x="38" y="280" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Lead Mobile Developer · TechCorp</text>
    <rect x="38" y="286" width="220" height="4" rx="2" fill="#94a3b8"/>
    <rect x="38" y="294" width="160" height="4" rx="2" fill="#cbd5e1"/>

    <text x="38" y="316" fill="#1e3a8a" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">SKILLS</text>
    <line x1="38" y1="320" x2="280" y2="320" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="38" y="328" width="45" height="12" rx="3" fill="#dbeafe"/>
    <text x="43" y="337" fill="#1e40af" font-family="-apple-system, sans-serif" font-size="8" font-weight="600">Flutter</text>
    <rect x="90" y="328" width="40" height="12" rx="3" fill="#dbeafe"/>
    <text x="96" y="337" fill="#1e40af" font-family="-apple-system, sans-serif" font-size="8" font-weight="600">Dart</text>
    <rect x="138" y="328" width="40" height="12" rx="3" fill="#dbeafe"/>
    <text x="144" y="337" fill="#1e40af" font-family="-apple-system, sans-serif" font-size="8" font-weight="600">React</text>
    <rect x="185" y="328" width="40" height="12" rx="3" fill="#dbeafe"/>
    <text x="191" y="337" fill="#1e40af" font-family="-apple-system, sans-serif" font-size="8" font-weight="600">Kotlin</text>

    <!-- Bottom Actions -->
    <rect x="24" y="382" width="276" height="38" rx="10" fill="url(#cvm-blue)"/>
    <text x="162" y="405" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Export PDF Document</text>
  </g>
</svg>