<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="mu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0813"/>
      <stop offset="60%" stop-color="#1d0d33"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <linearGradient id="mu-art" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#mu-bg)"/>
  <circle cx="680" cy="130" r="140" fill="#a855f7" opacity="0.2"/>
  <circle cx="130" cy="380" r="140" fill="#ec4899" opacity="0.15"/>

  <g transform="translate(230, 25)">
    <rect x="0" y="0" width="340" height="450" rx="36" fill="#090510" stroke="#37244f" stroke-width="3"/>
    <rect x="8" y="8" width="324" height="434" rx="28" fill="#130924"/>
    <rect x="110" y="14" width="104" height="20" rx="10" fill="#20103a"/>

    <!-- App Title -->
    <text x="170" y="60" text-anchor="middle" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">NOW PLAYING</text>

    <!-- Album Art -->
    <rect x="52" y="80" width="220" height="170" rx="20" fill="url(#mu-art)"/>
    <circle cx="162" cy="165" r="45" fill="rgba(0,0,0,0.3)"/>
    <!-- Note icon -->
    <path d="M 152 178 L 152 150 C 152 145 160 142 175 142 L 175 168" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="146" cy="178" r="9" fill="#ffffff"/>
    <circle cx="169" cy="168" r="9" fill="#ffffff"/>

    <!-- Track Info -->
    <text x="170" y="280" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="17" font-weight="700">Acoustic Serenade</text>
    <text x="170" y="298" text-anchor="middle" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="12">Flutter Audio Engine · Musify</text>

    <!-- Audio Waveform / Scrubber -->
    <line x1="36" y1="324" x2="288" y2="324" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-linecap="round"/>
    <line x1="36" y1="324" x2="160" y2="324" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
    <circle cx="160" cy="324" r="7" fill="#ffffff"/>
    <text x="36" y="342" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">2:18</text>
    <text x="288" y="342" text-anchor="end" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">4:05</text>

    <!-- Controls -->
    <!-- Prev -->
    <path d="M 100 376 L 115 366 L 115 386 Z" fill="#ffffff"/>
    <line x1="98" y1="366" x2="98" y2="386" stroke="#ffffff" stroke-width="2"/>
    <!-- Play/Pause -->
    <circle cx="162" cy="376" r="24" fill="#a855f7"/>
    <polygon points="157,366 173,376 157,386" fill="#ffffff"/>
    <!-- Next -->
    <path d="M 224 376 L 209 366 L 209 386 Z" fill="#ffffff"/>
    <line x1="226" y1="366" x2="226" y2="386" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>