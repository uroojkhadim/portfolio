<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="tc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="60%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#1a1c29"/>
    </linearGradient>
    <linearGradient id="tc-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#tc-bg)"/>
  <circle cx="680" cy="110" r="160" fill="#3b82f6" opacity="0.18"/>

  <g transform="translate(40, 25)">
    <rect width="720" height="450" rx="14" fill="#0b0d14" stroke="#1f2937" stroke-width="2"/>
    <rect width="720" height="42" rx="14" fill="#161922"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>
    <!-- URL Bar -->
    <rect x="220" y="9" width="280" height="24" rx="6" fill="#0b0d14"/>
    <text x="250" y="25" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11">techars.vercel.app</text>

    <!-- Navigation Header -->
    <rect x="0" y="42" width="720" height="48" fill="#0f111a"/>
    <text x="25" y="72" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="900">TECH<tspan fill="#3b82f6">ARS</tspan></text>
    <text x="200" y="72" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12">Services</text>
    <text x="280" y="72" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">Technologies</text>
    <text x="380" y="72" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">Case Studies</text>
    <text x="480" y="72" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">About</text>
    <rect x="590" y="52" width="105" height="28" rx="8" fill="url(#tc-accent)"/>
    <text x="642" y="70" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Contact Us</text>

    <!-- Hero Section -->
    <rect x="25" y="105" width="670" height="130" rx="14" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.2)"/>
    <text x="50" y="145" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">Architecting Next-Gen Digital Products</text>
    <text x="50" y="172" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Empowering enterprises with custom full-stack solutions, cloud infrastructure, and AI systems.</text>
    <rect x="50" y="188" width="130" height="32" rx="8" fill="#3b82f6"/>
    <text x="115" y="208" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Explore Services →</text>

    <!-- 3 Service Cards -->
    <rect x="25" y="250" width="210" height="175" rx="12" fill="#141824" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="55" cy="285" r="18" fill="rgba(59,130,246,0.2)"/>
    <text x="55" y="290" text-anchor="middle" fill="#3b82f6" font-size="14">💻</text>
    <text x="45" y="325" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Full-Stack Web</text>
    <text x="45" y="348" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Scalable React, Next.js, and Node.js web platforms with clean cloud APIs.</text>
    <text x="45" y="405" fill="#3b82f6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Learn More →</text>

    <rect x="255" y="250" width="210" height="175" rx="12" fill="#141824" stroke="rgba(59,130,246,0.3)"/>
    <circle cx="285" cy="285" r="18" fill="rgba(139,92,246,0.2)"/>
    <text x="285" y="290" text-anchor="middle" fill="#8b5cf6" font-size="14">📱</text>
    <text x="275" y="325" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Mobile Engineering</text>
    <text x="275" y="348" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Cross-platform Flutter &amp; Android native apps optimized for performance.</text>
    <text x="275" y="405" fill="#8b5cf6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Learn More →</text>

    <rect x="485" y="250" width="210" height="175" rx="12" fill="#141824" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="515" cy="285" r="18" fill="rgba(16,185,129,0.2)"/>
    <text x="515" y="290" text-anchor="middle" fill="#10b981" font-size="14">⚡</text>
    <text x="505" y="325" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Cloud &amp; DevOps</text>
    <text x="505" y="348" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Resilient CI/CD pipelines, containerized deployments, and microservices.</text>
    <text x="505" y="405" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Learn More →</text>
  </g>
</svg>