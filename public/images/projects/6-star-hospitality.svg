<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="hosp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="60%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#241e14"/>
    </linearGradient>
    <linearGradient id="hosp-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hosp-bg)"/>
  <circle cx="680" cy="110" r="150" fill="#f59e0b" opacity="0.15"/>

  <g transform="translate(40, 25)">
    <rect width="720" height="450" rx="14" fill="#0c111a" stroke="#2c281e" stroke-width="2"/>
    <rect width="720" height="42" rx="14" fill="#181d26"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>
    <!-- URL Bar -->
    <rect x="220" y="9" width="280" height="24" rx="6" fill="#0c111a"/>
    <text x="250" y="25" fill="#a3a3a3" font-family="-apple-system, sans-serif" font-size="11">6starhospitality.online</text>

    <!-- Luxury Navbar -->
    <rect x="0" y="42" width="720" height="48" fill="#101520"/>
    <text x="25" y="72" fill="url(#hosp-gold)" font-family="Georgia, serif" font-size="16" font-weight="700">★ ★ ★ ★ ★ ★ 6 STAR HOSPITALITY</text>
    <text x="360" y="71" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12">Suites</text>
    <text x="430" y="71" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">Dining</text>
    <text x="500" y="71" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">Concierge</text>
    <rect x="580" y="52" width="115" height="28" rx="6" fill="url(#hosp-gold)"/>
    <text x="637" y="70" text-anchor="middle" fill="#0c111a" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">Book Reservation</text>

    <!-- Hero Showcase Card -->
    <rect x="25" y="105" width="420" height="170" rx="12" fill="#141b26" stroke="#2e2b20"/>
    <text x="45" y="138" fill="url(#hosp-gold)" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">PREMIER LUXURY EXPERIENCE</text>
    <text x="45" y="168" fill="#ffffff" font-family="Georgia, serif" font-size="22" font-weight="700">Bespoke Living &amp; Fine Dining</text>
    <text x="45" y="194" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Curated world-class stays, 24/7 dedicated butler service, and Michelin-inspired gastronomy.</text>
    <rect x="45" y="218" width="140" height="32" rx="6" fill="url(#hosp-gold)"/>
    <text x="115" y="238" text-anchor="middle" fill="#0c111a" font-family="-apple-system, sans-serif" font-size="11" font-weight="800">Explore Collection</text>

    <!-- Reservation Booking Engine Widget -->
    <rect x="465" y="105" width="230" height="170" rx="12" fill="#161c28" stroke="rgba(245,158,11,0.25)"/>
    <text x="485" y="132" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Quick Availability</text>
    <rect x="485" y="145" width="190" height="28" rx="6" fill="#0d121c"/>
    <text x="495" y="163" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Check-in: Nov 12, 2026</text>
    <rect x="485" y="180" width="190" height="28" rx="6" fill="#0d121c"/>
    <text x="495" y="198" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Guests: 2 Adults · 1 Suite</text>
    <rect x="485" y="218" width="190" height="34" rx="6" fill="#d97706"/>
    <text x="580" y="239" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Find Available Suites</text>

    <!-- 3 Signature Suite Tiles -->
    <rect x="25" y="290" width="210" height="135" rx="10" fill="#141a24" stroke="#25241d"/>
    <text x="40" y="320" fill="url(#hosp-gold)" font-family="Georgia, serif" font-size="14" font-weight="700">The Royal Penthouse</text>
    <text x="40" y="342" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Panoramic Skyline View</text>
    <text x="40" y="380" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">$1,450 <tspan font-size="11" fill="#94a3b8">/ night</tspan></text>
    <text x="40" y="405" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="10">★★★★★★ 6-Star Service</text>

    <rect x="255" y="290" width="210" height="135" rx="10" fill="#141a24" stroke="#25241d"/>
    <text x="270" y="320" fill="url(#hosp-gold)" font-family="Georgia, serif" font-size="14" font-weight="700">Presidential Ocean Villa</text>
    <text x="270" y="342" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Private Infinity Pool</text>
    <text x="270" y="380" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">$2,100 <tspan font-size="11" fill="#94a3b8">/ night</tspan></text>
    <text x="270" y="405" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="10">★★★★★★ 6-Star Service</text>

    <rect x="485" y="290" width="210" height="135" rx="10" fill="#141a24" stroke="#25241d"/>
    <text x="500" y="320" fill="url(#hosp-gold)" font-family="Georgia, serif" font-size="14" font-weight="700">Imperial Heritage Suite</text>
    <text x="500" y="342" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Private Garden Terrace</text>
    <text x="500" y="380" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">$1,850 <tspan font-size="11" fill="#94a3b8">/ night</tspan></text>
    <text x="500" y="405" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="10">★★★★★★ 6-Star Service</text>
